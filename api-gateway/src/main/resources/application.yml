spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 다른 마이크로서비스로 연결되는 라우트 정의
        # Firebase는 클라이언트에서 직접 연결됩니다.

        # Eureka 서버 라우트
        - id: eureka-server
          uri: http://eureka-server:8761
          predicates:
            - Path=/eureka/**
        - id: ai-map-health
          uri: lb://ai-map
          predicates:
            - Path=/api/ai-map/api/v1/health
          filters:
            - StripPrefix=2
        - id: ai-map
          uri: lb://ai-map
          predicates:
            - Path=/api/ai-map/**
          filters:
            - StripPrefix=2
        - id: user-auth
          uri: lb://user-auth
          predicates:
            - Path=/api/user-auth/**
          filters:
            - StripPrefix=2
    config:
      enabled: false
  config:
    import: "optional:configserver:"

server:
  port: 8080

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    preferIpAddress: true
    instanceId: ${spring.application.name}:${server.port}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO
    org.springframework.cloud.netflix.eureka: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
